<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Galerisi - Ömer Kartlı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <header class="site-bar">
        <a href="index.html" class="marka">Ömer Kartlı</a>
        <nav class="site-nav">
            <a href="urunler.html" class="site-nav-link">Dijital Çözümler</a>
            <a href="https://wa.me/905545520912?text=Merhaba%20dijital%20%C3%BCr%C3%BCnler%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum"
               target="_blank" rel="noopener" class="pill pill-wa">WhatsApp</a>
        </nav>
    </header>

    <main class="icerik">
    <div class="card card-wide">
        <h1 id="eventTitle">Etkinlik</h1>
        <p class="bio" id="eventStatus">Yükleniyor...</p>

        <form id="uploadForm" class="upload-form">
            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                required
            >
            <input type="text" id="uploaderName" placeholder="Adın (opsiyonel)">
            <button type="submit" class="btn">Fotoğraf Yükle</button>
        </form>
        <p id="uploadMessage" class="upload-message"></p>

        <div id="gallery" class="gallery-grid"></div>
    </div>

    </main>

    <script src="script.js?v=6"></script>
    <script src="gallery.js?v=5"></script>
</body>
</html>
