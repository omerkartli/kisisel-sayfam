<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Galerisi - Ömer Kartlı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-link">Ana Sayfa</a>
        <a href="hakkimda.html" class="nav-link">Hakkımda</a>
        <a href="iletisim.html" class="nav-link">İletişim</a>
        <a href="urunler.html" class="nav-link">Diğer Ürünler</a>
    </nav>

    <div class="card card-wide">
        <h1 id="eventTitle">Etkinlik</h1>
        <p class="bio" id="eventStatus">Yükleniyor...</p>

        <form id="uploadForm" class="upload-form">
            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                required
            >
            <input type="text" id="uploaderName" placeholder="Adın (opsiyonel)">
            <button type="submit" class="btn">Fotoğraf Yükle</button>
        </form>
        <p id="uploadMessage" class="upload-message"></p>

        <div id="gallery" class="gallery-grid"></div>
    </div>

    <script src="script.js?v=3"></script>
    <script src="gallery.js?v=3"></script>
</body>
</html>
